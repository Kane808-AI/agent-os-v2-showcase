[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os-platform"
version = "2.0.0a20"
description = "Business-agnostic contracts and runtime for Agent OS v2"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.4"]

[project.scripts]
agent-os-pilot-service = "agent_os.pilot_service:main"
agent-os-pilot-canary = "agent_os.pilot_canary:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agent-os/deployment/postgresql" = ["deployment/postgresql/pilot-schema.sql"]

[tool.unittest]
start-directory = "tests"
