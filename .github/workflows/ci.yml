name: release-gates

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: unit-postgresql-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_PASSWORD: pilot-integration-only
          POSTGRES_DB: agent_os_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_os_pilot"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned project dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Run default unit suite
        run: python -m unittest discover -s tests -v

      - name: Run isolated PostgreSQL integration suite
        env:
          AOS_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:pilot-integration-only@127.0.0.1:5432/agent_os_pilot
        run: python -m unittest tests.test_postgresql_pilot -v

      - name: Install checksum-pinned Hadolint
        env:
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
        run: |
          binary="${RUNNER_TEMP}/hadolint"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${binary}" \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  ${binary}" | sha256sum --check --strict
          chmod 0500 "${binary}"

      - name: Lint the pilot container definition
        run: >-
          "${RUNNER_TEMP}/hadolint" --no-color --failure-threshold warning
          deployment/container/Dockerfile.pilot

      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          chmod 0500 "${RUNNER_TEMP}/gitleaks"

      - name: Scan complete reachable history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks" git --redact=100 --no-banner
          --log-level error --log-opts="--all" .
